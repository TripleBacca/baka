# Registers baka as the only C compiler on this CE instance. The local file
# overrides the defaults, so the C language dropdown shows just baka.

compilers=baka

compiler.baka.name=Baka (parse-only)
compiler.baka.exe=/opt/baka/bin/baka-ce
compiler.baka.compilerType=default
compiler.baka.versionFlag=--version
compiler.baka.versionRe=([0-9.]+)
compiler.baka.supportsBinary=false
compiler.baka.supportsBinaryObject=false
compiler.baka.supportsExecute=false