# All stages share the adapter and compiler; select a view in the dropdown.
compilers=&baka
defaultCompiler=baka

group.baka.compilers=baka:baka-ir:baka-semantic:baka-parse
group.baka.exe=/opt/baka/bin/baka-ce
group.baka.compilerType=default
group.baka.versionFlag=--version
group.baka.versionRe=([0-9.]+)
# Execution and "Compile to binary" link a static MIPS64 executable (see baka-ce),
# disassemble it with the cross objdump and run it under qemu-user.
group.baka.supportsBinary=true
group.baka.supportsBinaryObject=false
group.baka.supportsExecute=true
group.baka.objdumper=/usr/bin/mips64el-linux-gnuabi64-objdump
group.baka.executionWrapper=/usr/bin/qemu-mips64el
# MIPS binaries run locally through the wrapper, not on a remote MIPS host.
group.baka.emulated=true

compiler.baka.name=Baka (MIPS64 assembly)
compiler.baka.options=--codegen
compiler.baka.instructionSet=mips

compiler.baka-ir.name=Baka (typed TAC / IR)
compiler.baka-ir.options=--ir

compiler.baka-semantic.name=Baka (semantic AST)
compiler.baka-semantic.options=--semantic

compiler.baka-parse.name=Baka (parser AST)
compiler.baka-parse.options=--parse
