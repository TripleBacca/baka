services:
  compiler-explorer:
    build: .
    image: baka-compiler-explorer:latest
    container_name: ${CE_CONTAINER:-baka-godbolt}
    ports:
      # listens on every interface so other machines on the network can reach it;
      # set CE_BIND=127.0.0.1 to keep it local to this machine
      - "${CE_BIND:-0.0.0.0}:10240:10240"
    volumes:
      # Mount baka + wrapper + config without rebuilding the image. Recreate
      # the container after compiler builds so the mount follows the new binary.
      - ../build/baka:/opt/baka/bin/baka:ro
      - ./baka-ce:/opt/baka/bin/baka-ce:ro
      - ./config/c.local.properties:/compiler-explorer/etc/config/c.local.properties:ro
      - ./config/compiler-explorer.local.properties:/compiler-explorer/etc/config/compiler-explorer.local.properties:ro
      # Templates menu: our list and its preview screenshots replace CE's stock ones.
      - ./config/site-templates.yaml:/compiler-explorer/etc/config/site-templates.yaml:ro
      - ./template_screenshots:/compiler-explorer/out/webpack/static/template_screenshots:ro
      # Short share links (/z/...) are files in CE's local storage. Keep them in a
      # named volume so recreating or rebuilding the container doesn't break them.
      - links:/compiler-explorer/lib/storage/data
    restart: always

volumes:
  links:
