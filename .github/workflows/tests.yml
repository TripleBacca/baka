name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build compiler
        run: |
            make build

      - name: Build MIPS Test Image
        run: make mips-image

      - name: Run Custom Tests
        run: ./custom_test_hook

      - name: Run Peephole Unit Tests
        run: ctest --test-dir build -R '^peephole$' --output-on-failure --no-tests=error
